[project]
name = "intershop-allure3-demo"
version = "0.1.0"
description = "API + Web autotests for intershop6.skillbox.ru showcasing Allure Report 3"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.16.2",
    "httpx>=0.28.1",
    "mimesis>=22.2.0",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pytest>=8.4,<9",
    "pytest-playwright>=0.10.0",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--alluredir=allure-results",
    "--clean-alluredir",
    "--allure-link-pattern=tms:https://tms.example.com/case/{}",
    "--allure-link-pattern=issue:https://tracker.example.com/browse/{}",
    "-m", "not demo_failures",
    "--tb=line",
]
markers = [
    "api: API tests (httpx, WooCommerce Store API / wc-ajax / WP REST)",
    "web: UI tests (Playwright)",
    "e2e: end-to-end business flows across several pages",
    "smoke: fast critical checks, run first",
    "regression: full regression scope",
    "demo_failures: intentionally red tests that show failed/broken/flaky statuses in Allure (excluded by default)",
]
xfail_strict = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["intershop", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
# allure-python ships no type hints; its decorators and calls would otherwise fail strict mode.
untyped_calls_exclude = ["allure", "allure_commons"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["allure", "allure_commons.*", "mimesis.*"]
ignore_missing_imports = true
